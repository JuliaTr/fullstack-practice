<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>
<body>
  <div class="parent">
    <!-- 
    `contenteditable`:
      - transforms element into a live, user-editable text field directly inside the browser
      - `"true"` (element becomes editable; users can type, delete, apply text formating (like pasting styled text))
    -->
    <div class="child" contenteditable="true">
      :)
    </div>
  </div>
</body>
</html>
